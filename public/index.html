<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stewie console</title>
<style>
  :root {
    --bg: #07070a;
    --panel: #0f0f14;
    --panel-2: #14141b;
    --line: #22222c;
    --text: #ececf1;
    --dim: #9a9aa7;
    --faint: #61616f;
    --accent: #a78bfa;
    --green: #4ade80;
    --red: #f87171;
    --amber: #fbbf24;
    --cyan: #67e8f9;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; gap: 12px;
    padding: 18px 22px 16px; height: 100dvh; overflow: hidden;
  }
  .row { display: flex; align-items: center; gap: 10px; }
  .spacer { flex: 1; }

  header { flex: 0 0 auto; }
  .mark { font-weight: 650; letter-spacing: -0.02em; font-size: 15px; color: var(--text); white-space: nowrap; }
  .mark b { color: var(--accent); font-weight: 650; }
  .repo { color: var(--faint); font-family: var(--mono); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 42vw; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px;
    background: var(--panel); border: 1px solid var(--line); font-size: 11.5px; color: var(--dim);
    font-family: var(--mono); white-space: nowrap;
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
  .dot.warn { background: var(--amber); }
  .dot.bad { background: var(--red); }

  /* status strip */
  .status {
    flex: 0 0 auto; display: flex; align-items: center; gap: 14px;
    background: linear-gradient(180deg, #101017, #0c0c11);
    border: 1px solid var(--line); border-left: 3px solid var(--faint);
    border-radius: 12px; padding: 12px 16px; min-height: 60px;
  }
  .status.running { border-left-color: var(--cyan); }
  .status.done { border-left-color: var(--green); }
  .status.failed { border-left-color: var(--red); }
  .status.waiting { border-left-color: var(--amber); }
  .status .state { font-size: 15px; font-weight: 620; letter-spacing: -0.01em; }
  .status .what { color: var(--dim); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .status .what code { font-family: var(--mono); color: var(--text); font-size: 12px; }
  .status .chips { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .chip { font-family: var(--mono); font-size: 11px; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--dim); white-space: nowrap; }
  .chip.ok { color: var(--green); border-color: #1f3a29; }
  .chip.bad { color: var(--red); border-color: #3d2222; }
  .chip.run { color: var(--cyan); border-color: #1d3a3f; }
  .chip.warn { color: var(--amber); border-color: #3a3016; }

  /* goal */
  .goal { flex: 0 0 auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px 9px; }
  .goal:focus-within { border-color: #33334a; }
  textarea {
    width: 100%; resize: none; height: 40px; background: transparent; border: 0; outline: 0;
    color: var(--text); font: 14.5px/1.45 -apple-system, BlinkMacSystemFont, sans-serif;
  }
  textarea::placeholder { color: var(--faint); }
  .goalbar { display: flex; align-items: center; gap: 8px; padding-top: 8px; border-top: 1px solid #191921; }
  .check { display: inline-flex; align-items: center; gap: 6px; color: var(--dim); font-size: 12px; user-select: none; cursor: pointer; }
  .check input { accent-color: var(--accent); }

  button {
    font: inherit; font-size: 12.5px; font-weight: 550; color: var(--text);
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 11px; cursor: pointer; transition: background .14s, border-color .14s, transform .05s;
    white-space: nowrap;
  }
  button:hover:not(:disabled) { background: #1d1d26; border-color: #31313d; }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: .38; cursor: default; }
  button.primary { background: var(--accent); border-color: #8b6ff0; color: #160d30; font-weight: 600; }
  button.primary:hover:not(:disabled) { background: #b7a2ff; border-color: #b7a2ff; }
  button.danger { color: var(--red); }
  select {
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 5px 8px; font: 11.5px var(--mono); outline: 0; max-width: 380px;
  }

  /* main */
  main { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(280px, 1fr); gap: 12px; }
  @media (max-width: 980px) { main { grid-template-columns: 1fr; } body { overflow: auto; height: auto; } }
  .col { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  .col > .card { flex: 1 1 auto; }
  main.norun .col > .card { flex: 0 0 auto; }
  main.norun { align-content: start; }
  .empty { padding: 46px 26px; text-align: center; }
  .empty .t { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
  .empty .s { color: var(--faint); font-size: 12.5px; max-width: 460px; margin: 0 auto; line-height: 1.6; }
  .empty kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; color: var(--dim); }
  .checkslist { padding: 10px 14px; display: flex; flex-direction: column; gap: 6px; }
  .checkslist div { font-family: var(--mono); font-size: 11.5px; color: var(--dim); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .card > h2 {
    margin: 0; padding: 10px 13px; font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase;
    color: var(--faint); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; flex: 0 0 auto;
  }
  .card > h2 .n { color: var(--dim); font-family: var(--mono); letter-spacing: 0; text-transform: none; }
  .body { flex: 1 1 auto; min-height: 0; overflow: auto; }

  /* workers */
  .node { border-bottom: 1px solid #17171e; }
  .node:last-child { border-bottom: 0; }
  .node-head { display: flex; align-items: center; gap: 9px; padding: 9px 13px; cursor: pointer; }
  .node-head:hover { background: #13131a; }
  .node.open .node-head { background: #12121a; }
  .icon { width: 14px; text-align: center; font-size: 12px; flex: 0 0 auto; }
  .icon.done { color: var(--green); }
  .icon.failed { color: var(--red); }
  .icon.blocked { color: var(--amber); }
  .icon.running { color: var(--cyan); }
  .icon.pending { color: var(--faint); }
  .nid { font-family: var(--mono); font-size: 12px; flex: 0 0 auto; }
  .label { color: var(--dim); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1 1 auto; min-width: 0; }
  .badge { font-family: var(--mono); font-size: 10px; color: var(--faint); border: 1px solid #26262f; border-radius: 5px; padding: 1px 5px; flex: 0 0 auto; }
  .badge.heavy { color: var(--amber); border-color: #3a2f14; }
  .delta { font-family: var(--mono); font-size: 10.5px; flex: 0 0 auto; }
  .delta .a { color: var(--green); }
  .delta .d { color: var(--red); }
  .dur { font-family: var(--mono); font-size: 11px; color: var(--faint); flex: 0 0 auto; min-width: 40px; text-align: right; font-variant-numeric: tabular-nums; }
  .reason { color: var(--red); font-size: 11.5px; font-family: var(--mono); padding: 0 13px 8px 36px; }
  .checks { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 13px 8px 36px; }
  .checks .chip { font-size: 10px; padding: 1px 6px; }
  .log {
    margin: 0 12px 10px; padding: 9px 11px; background: #08080b; border: 1px solid #191921; border-radius: 8px;
    font-family: var(--mono); font-size: 11px; line-height: 1.5; color: #b3b3c2;
    white-space: pre-wrap; word-break: break-word; max-height: 230px; overflow: auto;
  }

  /* changes */
  .changes { padding: 8px 6px 10px; }
  .change { display: grid; grid-template-columns: minmax(0, 1fr) 64px 44px 40px; gap: 8px; align-items: center; padding: 4px 8px; font-family: var(--mono); font-size: 11.5px; }
  .change:hover { background: #13131a; border-radius: 6px; }
  .change .p { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #cfcfdb; }
  .bar { height: 4px; border-radius: 2px; background: #1b1b24; overflow: hidden; display: flex; }
  .bar i { display: block; height: 100%; }
  .bar .a { background: var(--green); opacity: .85; }
  .bar .d { background: var(--red); opacity: .85; }
  .change .a { color: var(--green); text-align: right; }
  .change .d { color: var(--red); text-align: right; }
  .muted { padding: 14px; color: var(--faint); font-size: 12px; text-align: center; }

  /* activity */
  .activity { padding: 10px 12px; min-height: 44px; font-family: var(--mono); font-size: 11px; line-height: 1.55; color: #a7a7b6; white-space: pre-wrap; word-break: break-word; }
  .activity:empty::before { content: "idle"; color: var(--faint); }

  /* big screen / tv mode: ?tv=1 */
  body.tv { padding: 28px 34px; gap: 16px; }
  body.tv .goal { display: none; }
  body.tv .status { padding: 18px 22px; min-height: 82px; border-left-width: 5px; }
  body.tv .status .state { font-size: 30px; letter-spacing: -0.02em; }
  body.tv .status .what { font-size: 17px; }
  body.tv .status .what code { font-size: 16px; }
  body.tv .chip { font-size: 14px; padding: 5px 11px; }
  body.tv .card > h2 { font-size: 13px; padding: 12px 16px; }
  body.tv .node-head { padding: 14px 16px; gap: 12px; }
  body.tv .nid { font-size: 15px; }
  body.tv .label { font-size: 14px; }
  body.tv .dur { font-size: 13px; min-width: 56px; }
  body.tv .badge { font-size: 11px; }
  body.tv .reason { font-size: 13px; }
  body.tv .log { font-family: var(--mono); font-size: 13px; max-height: 40vh; }
  body.tv .change { font-size: 14px; grid-template-columns: minmax(0, 1fr) 90px 56px 52px; }
  body.tv .mark { font-size: 18px; }
  body.tv #activityCard { display: none; }
  body.tv .empty .t { font-size: 22px; }
  body.tv .empty .s { font-size: 15px; }

  .pulse { animation: pulse 1.5s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .3 } }
  @media (prefers-reduced-motion: reduce) { .pulse { animation: none } }

  /* view switch */
  .views { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 2px; }
  .views button { background: transparent; border: 0; padding: 4px 11px; font-size: 11.5px; color: var(--dim); border-radius: 7px; display: inline-flex; align-items: center; gap: 6px; }
  .views button.on { background: var(--panel-2); color: var(--text); }
  .views .count[hidden] { display: none; }
  .views .count {
    min-width: 17px; height: 17px; padding: 0 5px; border-radius: 999px; background: var(--amber); color: #241a00;
    font-size: 10px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center;
  }
  body[class*="view-"] .status, body[class*="view-"] .goal, body[class*="view-"] #main { display: none; }
  body.view-console .status, body.view-console .goal, body.view-console #main { display: flex; }
  body.view-console .goal { display: block; }
  body.view-console #main { display: grid; }

  /* calendar */
  #calendar {
    display: none; flex: 1 1 auto; min-height: 0; position: relative;
    flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
  }
  body.view-calendar #calendar { display: flex; }
  .cal-bar { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-bottom: 1px solid var(--line); flex: 0 0 auto; }
  .cal-bar .nav { padding: 2px 9px; font-size: 14px; line-height: 1.2; }
  .cal-range { font-size: 13px; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; }
  .cal-seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .cal-seg button { border: 0; border-radius: 0; background: transparent; color: var(--dim); font-size: 11.5px; padding: 4px 10px; }
  .cal-seg button.on { background: var(--panel-2); color: var(--text); }
  .cal-main { flex: 1 1 auto; min-height: 0; display: flex; }
  .cal-scroll { flex: 1 1 auto; min-width: 0; overflow: auto; overscroll-behavior: contain; --hour: 54px; --gutter: 52px; --days: 7; }
  .cal-head, .cal-body {
    display: grid; grid-template-columns: var(--gutter) repeat(var(--days), minmax(104px, 1fr));
    min-width: calc(var(--gutter) + var(--days) * 104px);
  }
  .cal-head { position: sticky; top: 0; z-index: 20; background: #0b0b10; border-bottom: 1px solid var(--line); }
  .cal-head .tz { display: flex; align-items: flex-end; justify-content: flex-end; padding: 0 6px 6px 0; font-family: var(--mono); font-size: 9px; color: var(--faint); }
  .cal-dayh { padding: 7px 8px 8px; border-left: 1px solid var(--line); text-align: center; }
  .cal-dayh .d { font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); }
  .cal-dayh .n { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; margin-top: 2px; border-radius: 50%; font-size: 13px; font-weight: 600; color: var(--dim); font-variant-numeric: tabular-nums; }
  .cal-dayh.today .d { color: var(--accent); }
  .cal-dayh.today .n { background: var(--accent); color: #160d30; }
  .cal-body { position: relative; }
  .cal-gutter { position: relative; border-right: 1px solid var(--line); }
  .cal-gutter span { position: absolute; right: 6px; transform: translateY(-50%); font-family: var(--mono); font-size: 9.5px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .cal-day { position: relative; border-left: 1px solid #1a1a22; }
  .cal-day.today { background: rgba(167, 139, 250, .035); }
  .cal-day .line { position: absolute; inset-inline: 0; border-top: 1px solid #17171e; pointer-events: none; }
  .cal-day .line.half { border-top: 1px dotted #121219; }
  .cal-now { position: absolute; inset-inline: 0; border-top: 1px solid var(--red); z-index: 12; pointer-events: none; }
  .cal-now i { position: absolute; left: -3px; top: -3px; width: 6px; height: 6px; border-radius: 50%; background: var(--red); }
  .ev {
    position: absolute; overflow: hidden; text-align: left; padding: 3px 6px 4px; border-radius: 7px;
    background: var(--panel-2); border: 1px solid #26262f; border-left: 3px solid var(--faint);
    color: var(--text); cursor: pointer; font: inherit; font-size: 10.5px; line-height: 1.28;
  }
  .ev:hover { background: #1a1a23; border-color: #3a3a4a; border-left-color: inherit; z-index: 15; }
  .ev.done { border-left-color: var(--green); }
  .ev.failed { border-left-color: var(--red); }
  .ev.running { border-left-color: var(--cyan); }
  .ev.paused { border-left-color: var(--amber); }
  .ev.sel { outline: 1px solid var(--accent); outline-offset: 1px; z-index: 18; }
  .ev .t { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ev .m { display: block; font-family: var(--mono); font-size: 9px; color: var(--dim); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ev.tall .t { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .ev.tall .m { white-space: normal; }
  .cal-drawer {
    flex: 0 0 330px; width: 330px; border-left: 1px solid var(--line); background: var(--panel);
    overflow: auto; display: none;
  }
  .cal-drawer.open { display: block; }
  .cal-drawer .dh { position: sticky; top: 0; background: var(--panel); display: flex; align-items: center; gap: 8px; padding: 11px 12px; border-bottom: 1px solid var(--line); }
  .cal-drawer .dh .st { font-size: 10px; text-transform: uppercase; letter-spacing: .1em; font-weight: 600; }
  .cal-drawer .db { padding: 12px 14px 16px; display: flex; flex-direction: column; gap: 11px; }
  .cal-drawer .goaltext { font-size: 13.5px; line-height: 1.45; }
  .cal-drawer .kv { display: grid; grid-template-columns: 74px 1fr; gap: 3px 8px; font-size: 11.5px; color: var(--dim); }
  .cal-drawer .kv b { color: var(--faint); font-weight: 500; }
  .cal-drawer .kv span { font-family: var(--mono); font-size: 11px; color: var(--text); }
  .nodelist { display: flex; flex-direction: column; gap: 1px; }
  .nl { display: flex; align-items: center; gap: 7px; padding: 4px 2px; border-bottom: 1px solid #17171e; font-size: 11px; }
  .nl:last-child { border-bottom: 0; }
  .nl .id { font-family: var(--mono); font-size: 10.5px; }
  .nl .lb { flex: 1 1 auto; min-width: 0; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nl .du { font-family: var(--mono); font-size: 10px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .nodelist .why { color: var(--red); font-family: var(--mono); font-size: 10px; padding: 0 2px 5px 22px; }
  .cal-empty { padding: 60px 20px; text-align: center; color: var(--faint); font-size: 12.5px; line-height: 1.6; }
  body.tv .cal-scroll { --hour: 74px; --gutter: 62px; }
  body.tv .cal-range { font-size: 17px; }
  body.tv .cal-dayh .d { font-size: 11px; }
  body.tv .cal-dayh .n { width: 30px; height: 30px; font-size: 16px; }
  body.tv .ev { font-size: 13px; }
  body.tv .ev .m { font-size: 11px; }
  body.tv .cal-drawer { flex-basis: 400px; width: 400px; }
  body.tv .cal-drawer .goaltext { font-size: 16px; }
  body.tv .cal-drawer .kv, body.tv .nl { font-size: 13px; }

  /* inbox */
  #inbox {
    display: none; flex: 1 1 auto; min-height: 0; flex-direction: column;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
  }
  body.view-inbox #inbox { display: flex; }
  .ib-bar { display: flex; align-items: center; gap: 10px; padding: 10px 13px; border-bottom: 1px solid var(--line); flex: 0 0 auto; }
  .ib-bar .t { font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--faint); }
  .ib-bar .n { font-family: var(--mono); font-size: 11px; color: var(--dim); }
  .ib-body { flex: 1 1 auto; min-height: 0; overflow: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .ib-card { background: var(--panel-2); border: 1px solid #26262f; border-left: 3px solid var(--amber); border-radius: 10px; padding: 11px 13px 12px; }
  .ib-card.note { border-left-color: var(--cyan); }
  .ib-card.answered { border-left-color: var(--green); opacity: .72; }
  .ib-card .top { display: flex; align-items: baseline; gap: 9px; }
  .ib-card .qt { font-size: 13.5px; font-weight: 600; letter-spacing: -0.01em; flex: 1 1 auto; min-width: 0; }
  .ib-card .who { font-family: var(--mono); font-size: 10px; color: var(--faint); white-space: nowrap; }
  .ib-card .detail { margin: 7px 0 0; font-family: var(--mono); font-size: 11px; line-height: 1.5; color: #b3b3c2; white-space: pre-wrap; word-break: break-word; max-height: 180px; overflow: auto; }
  .ib-actions { display: flex; align-items: center; gap: 7px; margin-top: 10px; flex-wrap: wrap; }
  .ib-actions input {
    flex: 1 1 180px; min-width: 120px; background: #0b0b10; border: 1px solid var(--line); border-radius: 8px;
    color: var(--text); font: inherit; font-size: 12px; padding: 6px 9px; outline: 0;
  }
  .ib-actions input:focus { border-color: #3a3552; }
  .ib-actions button { font-size: 12px; padding: 5px 11px; }
  .ib-actions button.pick-no { color: var(--red); }
  .ib-actions button.pick-yes { background: var(--accent); border-color: #8b6ff0; color: #160d30; font-weight: 600; }
  .ib-actions button.pick-yes:hover:not(:disabled) { background: #b7a2ff; }
  .ib-empty { padding: 60px 24px; text-align: center; color: var(--faint); font-size: 12.5px; line-height: 1.7; }
  .ib-empty b { display: block; color: var(--dim); font-size: 14px; font-weight: 600; margin-bottom: 4px; }
  body.tv .ib-card .qt { font-size: 17px; }
  body.tv .ib-card .detail { font-size: 13px; }
  body.tv .ib-actions button { font-size: 14px; padding: 8px 14px; }

</style>
</head>
<body>
  <header class="row">
    <div class="mark">stewie <b>console</b></div>
    <div class="repo" id="repo"></div>
    <div class="spacer"></div>
    <div class="views" id="views">
      <button data-view="console">Console</button>
      <button data-view="calendar">Calendar</button>
      <button data-view="inbox" id="inboxTab">Inbox<span class="count" id="inboxCount" hidden></span></button>
    </div>
    <select id="runSelect" title="previous runs"></select>
    <div class="pill" id="sys"><span class="dot"></span><span>…</span></div>
  </header>

  <section class="status" id="status">
    <div class="row" style="gap:10px; min-width:0">
      <span class="dot" id="stateDot"></span>
      <div style="min-width:0">
        <div class="state" id="stateWord">idle</div>

  <section class="goal">

  <main id="main">
    <div class="col">
      <div class="card">
        <h2>Workers <span class="n" id="nodeCount"></span><span class="spacer"></span><span class="n" id="legend">✔ done · ▶ running · ✖ failed · ⊘ blocked · · queued</span></h2>
        <div class="body" id="nodes"><div class="muted">No run yet — describe a goal above and hit Plan.</div></div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmtGB = (b) => (b / 1073741824).toFixed(1);
const icon = (s) => ({ done: '✔', failed: '✖', blocked: '⊘', running: '▶', pending: '·' }[s] ?? '·');
const ORDER = { running: 0, failed: 1, blocked: 2, pending: 3, done: 4 };
const TV = new URLSearchParams(location.search).has('tv');
if (TV) document.body.classList.add('tv');
const state = { run: null, collapsed: new Set(), busy: false, lastLogAt: 0 };

function secs(n) {
  if (!n.startedAt) return '';
  const s = Math.round(((n.endedAt ?? Date.now()) - n.startedAt) / 1000);
  return s < 60 ? s + 's' : Math.floor(s / 60) + 'm ' + (s % 60) + 's';
}

async function api(path, opts) {
  const res = await fetch(path, opts);
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || res.statusText);
  return body;
}

function setStatus(kind, word, whatHtml) {
  $('status').className = 'status ' + kind;
  $('stateWord').textContent = word;
  $('stateWhat').innerHTML = whatHtml;
  $('stateDot').className = 'dot ' + ({ running: '', done: '', failed: 'bad', waiting: 'warn' }[kind] ?? '');
}

async function poll() {
  let d;
  try {
    d = await api('/api/overview' + (state.run ? '?run=' + encodeURIComponent(state.run) : ''));
  } catch (e) {
    $('activity').textContent = 'dashboard lost the repo: ' + e.message;
    return;
  }
  render(d);
}

function render(d) {
  $('repo').textContent = d.repo.replace(/^\/Users\/[^/]+/, '~');
  const s = d.system;
  $('sys').innerHTML = '<span class="dot ' + (s.ok ? '' : 'warn') + '"></span><span>load ' +
    s.load1.toFixed(1) + '/' + s.maxLoad.toFixed(0) + ' · ' + fmtGB(s.freeBytes) + 'GB free</span>';

  const sel = $('runSelect');
  const ids = d.runs.map((r) => r.id);
  if (sel.dataset.ids !== ids.join(',')) {
    sel.dataset.ids = ids.join(',');
    sel.innerHTML = d.runs.map((r) => '<option value="' + r.id + '">' + r.id + ' · ' + esc((r.goal || 'untitled').slice(0, 46)) + '</option>').join('');
    if (state.run) sel.value = state.run;
  }
  if (!state.run && d.runs[0]) { state.run = d.runs[0].id; sel.value = state.run; }

  const cur = d.current;
  $('runBtn').disabled = !d.hasGraph || state.busy;
  $('planBtn').disabled = state.busy;
  if (!cur) {
    state.busy = false;
    setStatus('', 'idle', 'no runs in this repo yet');
    $('chips').innerHTML = '';
    $('nodeCount').textContent = '';
    $('resumeBtn').disabled = true;
    $('stopBtn').disabled = true;
    $('main').classList.add('norun');
    $('nodes').innerHTML = TV
      ? '<div class="empty"><div class="t">Ready.</div><div class="s">Nothing running. Start a job from the Mac and it shows up here.</div></div>'
      : '<div class="empty"><div class="t">Ready.</div><div class="s">Describe a goal above. The planner maps it into workers, then they run two at a time with a check gate between them. <kbd>⌘⏎</kbd> starts it.</div></div>';
    $('changes').innerHTML = d.checks.length
      ? '<div class="checkslist">' + d.checks.map((c) => '<div>✓ ' + esc(c) + '</div>').join('') + '</div>'
      : '<div class="muted">No checks detected in this repo.</div>';
    $('changedFrom').textContent = d.checks.length ? 'checks available' : '';
    return;
  }

  $('main').classList.remove('norun');
  const nodes = cur.nodes.map((n) => ({ ...n, status: n.status || 'pending' }));
  const counts = {};
  for (const n of nodes) counts[n.status] = (counts[n.status] || 0) + 1;
  const running = nodes.filter((n) => n.status === 'running');
  const failed = nodes.filter((n) => n.status === 'failed');
  // The view layer (TV idle switch) hooks in here once it has loaded.
  if (typeof window.stewieOnOverview === 'function') window.stewieOnOverview(d);
  const queued = (counts.pending || 0) + (counts.blocked || 0);
  state.busy = running.length > 0;

  // status strip
  if (running.length) {
    const n = running[0];
    setStatus('running', 'Running', '<code>' + esc(n.id) + '</code> · ' + esc(n.label) + ' · ' + secs(n));
  } else if (failed.length) {
    const n = failed[0];
    setStatus('failed', 'Failed', '<code>' + esc(n.id) + '</code> · ' + esc(n.reason || 'stopped') + (failed.length > 1 ? ' · +' + (failed.length - 1) + ' more' : ''));
  } else if (queued) {
    setStatus('waiting', s.ok ? 'Paused' : 'Waiting on the machine', s.ok ? 'nothing running, ' + queued + ' queued' : esc(s.reasons.join('; ')));
  } else {
    setStatus('done', 'Done', nodes.length + ' workers finished · ' + new Date(cur.createdAt).toLocaleString());
  }

  const total = (key) => nodes.reduce((acc, n) => acc + (n.changes || []).length, 0);
  const chips = [];
  if (counts.done) chips.push('<span class="chip ok">' + counts.done + ' done</span>');
  if (counts.running) chips.push('<span class="chip run">' + counts.running + ' running</span>');
  if (counts.pending) chips.push('<span class="chip">' + counts.pending + ' queued</span>');
  if (counts.failed) chips.push('<span class="chip bad">' + counts.failed + ' failed</span>');
  if (counts.blocked) chips.push('<span class="chip warn">' + counts.blocked + ' blocked</span>');
  $('chips').innerHTML = chips.join('');

  $('nodeCount').textContent = nodes.length + ' nodes';
  $('resumeBtn').disabled = !(failed.length || queued) || state.busy;
  $('stopBtn').disabled = !running.length;

  // workers, running first
  const sorted = [...nodes].sort((a, b) => (ORDER[a.status] ?? 9) - (ORDER[b.status] ?? 9));
  $('nodes').innerHTML = sorted.map((n) => {
    const open = !state.collapsed.has(n.id) && (n.status === 'running' || n.status === 'failed');
    const adds = (n.changes || []).reduce((a, c) => a + c.adds, 0);
    const dels = (n.changes || []).reduce((a, c) => a + c.deletes, 0);
    const checks = (n.verify || []).map((v) => '<span class="chip ' + (v.code === 0 ? 'ok' : 'bad') + '">' + (v.code === 0 ? '✓' : '✗') + ' ' + esc(v.command) + '</span>').join('');
    return '<div class="node' + (open ? ' open' : '') + '" data-node="' + esc(n.id) + '">' +
      '<div class="node-head">' +
        '<span class="icon ' + n.status + (n.status === 'running' ? ' pulse' : '') + '">' + icon(n.status) + '</span>' +
        '<span class="nid">' + esc(n.id) + '</span>' +
        '<span class="badge ' + (n.heavy ? 'heavy' : '') + '">' + esc(n.kind) + '</span>' +
        '<span class="label">' + esc(n.label) + '</span>' +
        (n.attempts > 1 ? '<span class="badge">try ' + n.attempts + '</span>' : '') +
        (adds || dels ? '<span class="delta"><span class="a">+' + adds + '</span> <span class="d">−' + dels + '</span></span>' : '') +
        '<span class="dur">' + secs(n) + '</span>' +
      '</div>' +
      (n.reason ? '<div class="reason">' + esc(n.reason) + '</div>' : '') +
      (checks ? '<div class="checks">' + checks + '</div>' : '') +
      (open ? '<pre class="log" data-log="' + esc(n.id) + '">loading…</pre>' : '') +
    '</div>';
  }).join('');

  renderChanges(nodes);
  for (const el of document.querySelectorAll('[data-log]')) loadLog(el.dataset.log, el);
}

function renderChanges(nodes) {
  // diffs are cumulative snapshots: use the most recently finished node that has one
  const withChanges = nodes
    .filter((n) => (n.changes || []).length)
    .sort((a, b) => (b.endedAt || 0) - (a.endedAt || 0));
  if (!withChanges.length) {
    $('changes').innerHTML = '<div class="muted">Nothing changed yet.</div>';
    $('changedFrom').textContent = '';
    return;
  }
  const latest = withChanges[0];
  const files = [...latest.changes].sort((a, b) => (b.adds + b.deletes) - (a.adds + a.deletes));
  const max = Math.max(1, ...files.map((f) => f.adds + f.deletes));
  $('changedFrom').textContent = 'from ' + latest.id;
  $('changes').innerHTML = '<div class="changes">' + files.map((f) => {
    const w = (f.adds + f.deletes) / max;
    const aw = f.adds / (f.adds + f.deletes || 1);
    return '<div class="change">' +
      '<span class="p" title="' + esc(f.path) + '">' + esc(f.path) + '</span>' +
      '<span class="bar"><i class="a" style="width:' + (w * aw * 100).toFixed(1) + '%"></i><i class="d" style="width:' + (w * (1 - aw) * 100).toFixed(1) + '%"></i></span>' +
      '<span class="a">+' + (f.binary ? 'bin' : f.adds) + '</span>' +
      '<span class="d">−' + (f.binary ? '' : f.deletes) + '</span>' +
    '</div>';
  }).join('') + '</div>';
}

async function loadLog(node, el) {
  try {
    const data = await api('/api/log?run=' + encodeURIComponent(state.run) + '&node=' + encodeURIComponent(node) + '&lines=200');
    const atBottom = el.scrollTop + el.clientHeight >= el.scrollHeight - 40;
    el.textContent = data.text || '(no output yet)';
    if (atBottom) el.scrollTop = el.scrollHeight;
  } catch { /* ignored */ }
}

async function pollJobs() {
  try {
    const jobs = await api('/api/jobs');
    const job = jobs[jobs.length - 1];
    $('activity').textContent = job ? job.output : '';
    const el = $('activity').parentElement;
    el.scrollTop = el.scrollHeight;
    if (job?.status !== 'running' && $('stopBtn').disabled === false && jobs.length) {
      // a job finished; the next poll picks up the new run
    }
  } catch { /* ignored */ }
}

document.addEventListener('click', (e) => {
  const head = e.target.closest('.node-head');
  if (!head) return;
  const id = head.closest('.node').dataset.node;
  if (state.collapsed.has(id)) state.collapsed.delete(id);
  else state.collapsed.add(id);
  poll();
});

$('planBtn').onclick = async () => {
  const goal = $('goal').value.trim();
  if (!goal) return $('goal').focus();
  $('planBtn').disabled = true;
  try {
    await api('/api/plan', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ goal, execute: $('chain').checked }) });
    $('activity').textContent = 'planning…';
  } catch (e) { $('activity').textContent = e.message; }
};
$('runBtn').onclick = async () => {
  try { await api('/api/run', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ concurrency: 2 }) }); }
  catch (e) { $('activity').textContent = e.message; }
};
$('resumeBtn').onclick = async () => {
  try { await api('/api/resume', { method: 'POST' }); } catch (e) { $('activity').textContent = e.message; }
};
$('stopBtn').onclick = async () => {
  try { await api('/api/stop', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ hard: false }) }); }
  catch (e) { $('activity').textContent = e.message; }
};
$('runSelect').onchange = (e) => { state.run = e.target.value; poll(); };
$('goal').addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); $('planBtn').click(); }
});

poll();
pollJobs();
setInterval(poll, 1500);
setInterval(pollJobs, 1500);
setInterval(() => { for (const el of document.querySelectorAll('[data-log]')) loadLog(el.dataset.log, el); }, 2000);
</script>
<script>
// ---------------------------------------------------------------- views
// Console, Calendar and Inbox are three looks at the same .stewie folder.
const VIEWS = ['console', 'calendar', 'inbox'];
const view = { name: 'console' };

// TV mode turns itself over: after a quiet spell the wall screen shows the week,
// and the first sign of work pulls it back to the console. A hand-picked view wins
// for a while, so nobody fighting the remote loses the screen to a timer.
const IDLE = (() => {
  const q = new URLSearchParams(location.search);
  const secs = Number(q.get('idle') ?? 90);
  return { on: TV, ms: (Number.isFinite(secs) && secs > 0 ? secs : 90) * 1000 };
})();
let lastActivityAt = Date.now();
let lastManualAt = 0;

function setView(name, { user = false } = {}) {
  view.name = VIEWS.includes(name) ? name : 'console';
  if (user) lastManualAt = Date.now();
  for (const k of VIEWS) document.body.classList.toggle('view-' + k, view.name === k);
  for (const b of document.querySelectorAll('#views button')) b.classList.toggle('on', b.dataset.view === view.name);
  if (view.name === 'calendar') loadCalendar();
  if (view.name === 'inbox') loadInbox();
  if (view.name === 'console') poll();
}

document.addEventListener('click', (e) => {
  const tab = e.target.closest('#views button');
  if (tab) setView(tab.dataset.view, { user: true });
});

// Anything running counts as activity, and pulls a wall screen back to the live view.
window.stewieOnOverview = (d) => {
  const nodes = d?.current?.nodes ?? [];
  const running = nodes.some((n) => n.status === 'running');
  if (!running) return;
  lastActivityAt = Date.now();
  if (IDLE.on && view.name === 'calendar' && Date.now() - lastManualAt > IDLE.ms) setView('console');
};

setInterval(() => {
  if (!IDLE.on) return;
  const quietFor = Date.now() - Math.max(lastActivityAt, lastManualAt);
  if (quietFor < IDLE.ms) return;
  if (view.name === 'console') setView('calendar');
}, 2000);

// ---------------------------------------------------------------- calendar
const CAL = { anchor: Date.now(), days: 7, data: null, sel: null };
const DOW = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
const dayStart = (ms) => { const d = new Date(ms); d.setHours(0, 0, 0, 0); return d.getTime(); };
const addDays = (ms, n) => { const d = new Date(ms); d.setDate(d.getDate() + n); return d.getTime(); };
const weekStart = (ms) => { const d = new Date(dayStart(ms)); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return d.getTime(); };
const hm = (ms) => new Date(ms).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
const span = (ms) => { const s = Math.max(0, Math.round(ms / 1000)); return s < 60 ? s + 's' : Math.floor(s / 60) + 'm ' + (s % 60) + 's'; };
const hourPx = () => (document.body.classList.contains('tv') ? 74 : 54);
const tzLabel = () => {
  const m = -new Date().getTimezoneOffset();
  const h = Math.floor(Math.abs(m) / 60);
  const mi = Math.abs(m) % 60;
  return 'GMT' + (m < 0 ? '-' : '+') + h + (mi ? ':' + String(mi).padStart(2, '0') : '');
};

async function loadCalendar() {
  try {
    const d = await api('/api/calendar?anchor=' + CAL.anchor + '&days=' + CAL.days);
    CAL.data = d;
    renderCalendar(d);
  } catch (e) {
    $('calHead').innerHTML = '';
    $('calBody').innerHTML = '<div class="cal-empty">' + esc(e.message) + '</div>';
  }
}

/** Side-by-side columns for overlapping runs (a wide run never hides a short one). */
function packColumns(items) {
  const sorted = [...items].sort((a, b) => a.start - b.start || (a.end - a.start) - (b.end - b.start));
  const out = new Map();
  let cluster = [];
  let clusterEnd = 0;
  let lanes = [];
  const close = () => {
    const cols = Math.max(1, ...cluster.map((i) => out.get(i.run.id).col + 1));
    for (const i of cluster) out.get(i.run.id).cols = cols;
    cluster = [];
    lanes = [];
    clusterEnd = 0;
  };
  for (const it of sorted) {
    if (cluster.length && it.start >= clusterEnd) close();
    let col = lanes.findIndex((endAt) => endAt <= it.start);
    if (col < 0) { col = lanes.length; lanes.push(it.end); } else lanes[col] = it.end;
    out.set(it.run.id, { col, cols: 1 });
    cluster.push(it);
    clusterEnd = Math.max(clusterEnd, it.end);
  }
  if (cluster.length) close();
  return out;
}

function renderCalendar(d) {
  const hour = hourPx();
  const days = d.days;
  const starts = Array.from({ length: days }, (_, i) => addDays(d.from, i));
  const today = dayStart(Date.now());
  const now = d.now || Date.now();
  const scroll = $('calScroll');
  scroll.style.setProperty('--days', days);
  scroll.style.setProperty('--hour', hour + 'px');

  const a = new Date(d.from);
  const b = new Date(addDays(d.from, days - 1));
  const opts = { month: 'short', day: 'numeric' };
  $('calRange').textContent = days === 1
    ? a.toLocaleDateString([], { weekday: 'long', month: 'short', day: 'numeric' })
    : a.toLocaleDateString([], opts) + ' – ' + b.toLocaleDateString([], opts);

  $('calHead').innerHTML = '<div class="tz">' + tzLabel() + '</div>' + starts.map((s) => {
    const dd = new Date(s);
    return '<div class="cal-dayh' + (s === today ? ' today' : '') + '">' +
      '<div class="d">' + DOW[(dd.getDay() + 6) % 7] + '</div>' +
      '<div class="n">' + dd.getDate() + '</div></div>';
  }).join('');

  const byDay = new Map(starts.map((s) => [s, []]));
  for (const run of d.runs) {
    const key = dayStart(run.startedAt);
    if (byDay.has(key)) byDay.get(key).push(run);
  }

  const gutter = Array.from({ length: 24 }, (_, h) => h === 0 ? '' :
    '<span style="top:' + (h * hour) + 'px">' + new Date(2000, 0, 1, h).toLocaleTimeString([], { hour: 'numeric' }) + '</span>').join('');

  $('calBody').innerHTML = '<div class="cal-gutter">' + gutter + '</div>' + starts.map((s) => {
    const end = addDays(s, 1);
    const items = byDay.get(s).map((run) => ({
      run,
      start: Math.max(run.startedAt, s),
      end: Math.max(Math.min(run.endedAt ?? now, end), Math.max(run.startedAt, s) + 60_000),
    }));
    const lanes = packColumns(items);
    const lines = Array.from({ length: 48 }, (_, i) =>
      '<div class="line' + (i % 2 ? ' half' : '') + '" style="top:' + (i * hour) / 2 + 'px"></div>').join('');
    const nowTop = ((now - s) / 3_600_000) * hour;
    const nowLine = s === today && nowTop >= 0 && nowTop <= 24 * hour
      ? '<div class="cal-now" style="top:' + nowTop + 'px"><i></i></div>' : '';
    return '<div class="cal-day' + (s === today ? ' today' : '') + '">' + lines + nowLine +
      items.map((it) => blockHtml(it, lanes.get(it.run.id), s, hour)).join('') + '</div>';
  }).join('');

  const t = d.totals;
  const chips = ['<span class="chip">' + t.runs + ' run' + (t.runs === 1 ? '' : 's') + '</span>'];
  if (t.running) chips.push('<span class="chip run">' + t.running + ' running</span>');
  if (t.done) chips.push('<span class="chip ok">' + t.done + ' done</span>');
  if (t.failed) chips.push('<span class="chip bad">' + t.failed + ' failed</span>');
  if (t.paused) chips.push('<span class="chip warn">' + t.paused + ' paused</span>');
  if (t.files) chips.push('<span class="chip">' + t.files + ' files <span style="color:var(--green)">+' + t.adds + '</span> <span style="color:var(--red)">−' + t.deletes + '</span></span>');
  $('calTotals').innerHTML = chips.join('');

  // Open the week at the current hour the first time, so the screen shows today's work.
  const scrollKey = d.from + ':' + days;
  if (CAL.scrollKey !== scrollKey) {
    CAL.scrollKey = scrollKey;
    const hourNow = new Date().getHours();
    const anchorHour = starts.includes(today) ? Math.max(0, hourNow - 2) : 7;
    requestAnimationFrame(() => {
      scroll.scrollTop = anchorHour * hour - scroll.clientHeight * 0.35;
    });
  }

  renderDrawer();
}

function blockHtml(it, lane, dayStartMs, hour) {
  const run = it.run;
  const top = ((it.start - dayStartMs) / 3_600_000) * hour;
  const height = Math.max(22, ((it.end - it.start) / 3_600_000) * hour - 2);
  const lay = lane || { col: 0, cols: 1 };
  const width = 100 / lay.cols;
  const failed = run.counts.failed || 0;
  const tall = height > 54;
  const meta = hm(it.start) + (run.endedAt ? '–' + hm(run.endedAt) : ' · running') +
    ' · ' + run.nodes.length + ' worker' + (run.nodes.length === 1 ? '' : 's') + (failed ? ' · ' + failed + ' failed' : '');
  return '<button class="ev ' + esc(run.status) + (tall ? ' tall' : '') + (CAL.sel === run.id ? ' sel' : '') + '"' +
    ' data-run="' + esc(run.id) + '"' +
    ' style="top:' + top + 'px;height:' + height + 'px;left:calc(' + width * lay.col + '% + 2px);width:calc(' + width + '% - 4px)"' +
    ' title="' + esc(run.goal || run.id) + '">' +
    '<span class="t">' + esc(run.goal || run.id) + '</span>' +
    (tall ? '<span class="m">' + esc(meta) + '</span>' : '') +
    '</button>';
}

function renderDrawer() {
  const drawer = $('calDrawer');
  const run = (CAL.data?.runs ?? []).find((r) => r.id === CAL.sel);
  if (!run) {
    drawer.classList.remove('open');
    drawer.innerHTML = '';
    return;
  }
  const color = { done: 'var(--green)', failed: 'var(--red)', running: 'var(--cyan)', paused: 'var(--amber)' }[run.status] || 'var(--faint)';
  drawer.classList.add('open');
  const countChips = ['done', 'running', 'pending', 'failed', 'blocked']
    .filter((k) => run.counts[k])
    .map((k) => '<span class="chip ' + ({ done: 'ok', failed: 'bad', running: 'run', pending: '', blocked: 'warn' }[k] ?? '') + '">' + run.counts[k] + ' ' + k + '</span>')
    .join('');
  const nodes = run.nodes.map((n) => {
    const icon = ({ done: '✔', failed: '✖', blocked: '⊘', running: '▶', pending: '·' }[n.status]) ?? '·';
    const took = n.startedAt ? span((n.endedAt ?? run.endedAt ?? Date.now()) - n.startedAt) : '';
    return '<div class="nl"><span class="icon ' + esc(n.status) + '">' + icon + '</span>' +
      '<span class="id">' + esc(n.id) + '</span>' +
      '<span class="lb">' + esc(n.label || n.kind) + '</span>' +
      '<span class="du">' + took + '</span></div>' +
      (n.reason ? '<div class="why">' + esc(n.reason) + '</div>' : '');
  }).join('');

  drawer.innerHTML =
    '<div class="dh"><span class="st" style="color:' + color + '">' + esc(run.status) + '</span>' +
    '<span class="who" style="font-family:var(--mono);font-size:10px;color:var(--faint)">' + esc(run.id) + '</span>' +
    '<div class="spacer" style="flex:1"></div>' +
    '<button data-close-drawer title="close">×</button></div>' +
    '<div class="db">' +
    '<div class="goaltext">' + esc(run.goal || '(no goal recorded)') + '</div>' +
    '<div class="kv">' +
    '<b>when</b><span>' + new Date(run.startedAt).toLocaleString([], { weekday: 'short', hour: 'numeric', minute: '2-digit' }) + '</span>' +
    '<b>took</b><span>' + span((run.endedAt ?? Date.now()) - run.startedAt) + '</span>' +
    '<b>changes</b><span>' + (run.changes.files ? run.changes.files + ' files +' + run.changes.adds + ' −' + run.changes.deletes : 'none') + '</span>' +
    (run.stats?.retries ? '<b>retries</b><span>' + run.stats.retries + '</span>' : '') +
    '</div>' +
    (countChips ? '<div class="checks">' + countChips + '</div>' : '') +
    '<div class="nodelist">' + nodes + '</div>' +
    '<button data-open-run="' + esc(run.id) + '">Open in console</button>' +
    '</div>';
}

$('calPrev').onclick = () => { CAL.anchor = addDays(CAL.anchor, -CAL.days); CAL.sel = null; loadCalendar(); };
$('calNext').onclick = () => { CAL.anchor = addDays(CAL.anchor, CAL.days); CAL.sel = null; loadCalendar(); };
$('calToday').onclick = () => { CAL.anchor = Date.now(); CAL.sel = null; loadCalendar(); };
$('calSeg').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-days]');
  if (!b) return;
  CAL.days = Number(b.dataset.days);
  for (const x of $('calSeg').querySelectorAll('button')) x.classList.toggle('on', x === b);
  CAL.anchor = CAL.days === 1 ? dayStart(CAL.anchor) : weekStart(CAL.anchor);
  loadCalendar();
});

document.addEventListener('click', (e) => {
  const ev = e.target.closest('[data-run]');
  if (ev) {
    CAL.sel = ev.dataset.run;
    if (CAL.data) renderCalendar(CAL.data);
    return;
  }
  if (e.target.closest('[data-close-drawer]')) {
    CAL.sel = null;
    if (CAL.data) renderCalendar(CAL.data);
    return;
  }
  const open = e.target.closest('[data-open-run]');
  if (open) {
    state.run = open.dataset.openRun;
    setView('console');
  }
});

document.addEventListener('keydown', (e) => {
  if (view.name !== 'calendar') return;
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName ?? '')) return;
  if (e.key === 'ArrowLeft') { $('calPrev').click(); }
  if (e.key === 'ArrowRight') { $('calNext').click(); }
  if (e.key === 'Escape') { CAL.sel = null; if (CAL.data) renderCalendar(CAL.data); }
});

// ---------------------------------------------------------------- inbox
const INBOX = { all: false, data: null };

async function loadInbox() {
  try {
    const d = await api('/api/inbox' + (INBOX.all ? '?status=all' : ''));
    INBOX.data = d;
    renderInbox(d);
    setInboxBadge(d.count);
  } catch (e) {
    $('inboxBody').innerHTML = '<div class="ib-empty"><b>inbox unavailable</b>' + esc(e.message) + '</div>';
  }
}

function setInboxBadge(n) {
  const el = $('inboxCount');
  if (!el) return;
  el.hidden = !n;
  el.textContent = n;
}

const ago = (at) => {
  const s = Math.round((Date.now() - at) / 1000);
  if (s < 60) return s + 's ago';
  if (s < 3600) return Math.round(s / 60) + 'm ago';
  if (s < 86400) return Math.round(s / 3600) + 'h ago';
  return Math.round(s / 86400) + 'd ago';
};

const refusal = (choice) => /^(no|nope|deny|denied|skip|cancel|stop|reject|disallow)\b/i.test(String(choice ?? '').trim());

function renderInbox(d) {
  const open = d.open ?? [];
  const answered = INBOX.all ? (d.items ?? []).filter((i) => i.status !== 'open') : [];
  $('inboxSub').textContent = open.length ? open.length + ' waiting' : 'nothing waiting on you';

  if (!open.length && !answered.length) {
    $('inboxBody').innerHTML = '<div class="ib-empty"><b>Nothing is waiting on you.</b>' +
      'A worker that needs a call runs <code>stewie ask</code> and lands here. A graph node with <code>"ask": true</code> holds until you answer.</div>';
    return;
  }

  const card = (item) => {
    const who = [item.askedBy, item.node, ago(item.createdAt)].filter(Boolean).join(' · ');
    const isQuestion = item.kind === 'question';
    if (item.status !== 'open') {
      return '<div class="ib-card answered' + (isQuestion ? '' : ' note') + '">' +
        '<div class="top"><div class="qt">' + esc(item.title) + '</div><div class="who">' + esc(who) + '</div></div>' +
        '<div class="ib-actions"><span class="chip ok">' + esc(item.answer?.choice || item.status) + '</span>' +
        (item.answer?.note ? '<span class="chip">' + esc(item.answer.note) + '</span>' : '') + '</div></div>';
    }
    const options = item.options?.length ? item.options : (isQuestion ? ['allow', 'skip'] : []);
    const buttons = options.map((o, i) =>
      '<button data-choice="' + esc(o) + '" class="' + (!refusal(o) && i === 0 ? 'pick-yes' : refusal(o) ? 'pick-no' : '') + '">' + esc(o) + '</button>').join('');
    return '<div class="ib-card' + (isQuestion ? '' : ' note') + '" data-card="' + esc(item.id) + '">' +
      '<div class="top"><div class="qt">' + esc(item.title) + '</div><div class="who">' + esc(who) + '</div></div>' +
      (item.detail ? '<pre class="detail">' + esc(item.detail) + '</pre>' : '') +
      '<div class="ib-actions">' +
      (isQuestion ? '<input data-note placeholder="a note back to the agent (optional)">' : '') +
      buttons +
      '<button data-dismiss title="take it off the queue">' + (isQuestion ? 'not now' : 'seen') + '</button>' +
      '</div></div>';
  };

  $('inboxBody').innerHTML = open.map(card).join('') + (answered.length ? answered.map(card).join('') : '');
}

async function answerInbox(id, choice, note) {
  try {
    await api('/api/inbox/answer', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ id, choice, note }),
    });
  } catch (e) {
    $('inboxSub').textContent = e.message;
  }
  loadInbox();
}

async function dismissInbox(id) {
  try {
    await api('/api/inbox/dismiss', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ id }),
    });
  } catch (e) {
    $('inboxSub').textContent = e.message;
  }
  loadInbox();
}

$('inboxBody').addEventListener('click', (e) => {
  const card = e.target.closest('[data-card]');
  if (!card) return;
  const note = card.querySelector('input[data-note]')?.value?.trim() ?? '';
  const pick = e.target.closest('[data-choice]');
  if (pick) return answerInbox(card.dataset.card, pick.dataset.choice, note);
  if (e.target.closest('[data-dismiss]')) return dismissInbox(card.dataset.card);
});
$('inboxBody').addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  const card = e.target.closest('[data-card]');
  if (!card) return;
  const first = card.querySelector('[data-choice]');
  if (!first) return;
  e.preventDefault();
  answerInbox(card.dataset.card, first.dataset.choice, card.querySelector('input[data-note]')?.value?.trim() ?? '');
});
$('inboxAll').onchange = (e) => { INBOX.all = e.target.checked; loadInbox(); };
$('inboxRefresh').onclick = () => loadInbox();

// ---------------------------------------------------------------- boot the right view
setView(new URLSearchParams(location.search).get('view') || 'console');

const refreshBadge = () => api('/api/inbox').then((d) => setInboxBadge(d.count)).catch(() => {});
refreshBadge();
setInterval(refreshBadge, 5000);
setInterval(() => { if (view.name === 'calendar') loadCalendar(); }, 5000);
setInterval(() => { if (view.name === 'inbox') loadInbox(); }, 5000);
</script>
</body>
